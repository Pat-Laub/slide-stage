// A window property supplies the missing global binding; if a later Quarto
// version declares its own lexical variable, that variable simply shadows it.

<script>
// Immediate URL-hash sync for reveal.js (defeats its replaceState throttle).
//
// With `history: false` (our setting) reveal.js keeps the address-bar `#` in
// step with the current slide via history.replaceState — but it throttles that
// call to at most once per second (its MAX_REPLACE_STATE_FREQUENCY). When you
// cross two slide boundaries within a second the second write is *deferred* by
// up to a second, so the visible `#` lags a slide behind what's on screen. This
// is easy to trigger around slides with fragments, where you click through the
// build quickly: arrive at the slide, the hash update gets queued, and a refresh
// before it fires jumps you back to the previous (stale) slide.
//
// Fix: on every slide change write the correct hash ourselves, immediately and
// un-throttled. We stay in replaceState mode (history:false — no extra
// Back-button entries per slide); reveal's own deferred write lands on the same
// value a moment later, so the two never disagree. slideHash() mirrors reveal's
// internal getHash()/writeURL() so the string we write is byte-for-byte what it
// would have written.
(function () {
  function slideHash() {
    var slide = Reveal.getCurrentSlide();
    var id = slide ? slide.getAttribute('id') : null;
    if (id) id = encodeURIComponent(id);
    var idx = Reveal.getIndices();
    var cfg = Reveal.getConfig();
    var f = cfg.fragmentInURL ? idx.f : undefined; // fragments excluded unless enabled
    var hash = '/';
    if (typeof id === 'string' && id.length) {
      hash = '/' + id;
      if (f >= 0) hash += '/' + f;
    } else {
      var base = cfg.hashOneBasedIndex ? 1 : 0;
      if (idx.h > 0 || idx.v > 0 || f >= 0) hash += idx.h + base;
      if (idx.v > 0 || f >= 0) hash += '/' + (idx.v + base);
      if (f >= 0) hash += '/' + f;
    }
    return hash;
  }

  function syncHash() {
    if (!window.Reveal || !Reveal.getCurrentSlide) return;
    if (Reveal.getConfig().history) return; // history:true already writes immediately
    var hash = slideHash();
    // Mirror reveal: a root hash drops the `#` entirely, keeping path + query.
    var url = hash === '/' ? location.pathname + location.search : '#' + hash;
    history.replaceState(null, null, url);
  }

  var attached = false;
  function attach() {
    if (attached || !window.Reveal || !Reveal.on) return false;
    attached = true;
    // Only subsequent navigations are affected: reveal's *first* URL write at
    // init isn't throttled, so the load-time hash (incl. a deep link) is already
    // correct — we deliberately don't touch it here.
    Reveal.on('slidechanged', syncHash);
    return true;
  }

  // Reveal may not be initialised yet when this after-body script runs; wait for it.
  if (!attach()) {
    var iv = setInterval(function () { if (attach()) clearInterval(iv); }, 50);
    setTimeout(function () { clearInterval(iv); }, 10000);
  }
})();
</script>
<script>
// Always enter a vertical stack at its top when moving forward.
//
// These decks run in reveal's `linear` navigation mode (Quarto's default).
// There, every navigation key advances in linear reading order — down a stack,
// then on to the *top* of the next one — while the same keys walk the 2D grid
// once Overview is open (left/down/up/right). That's exactly the behaviour we
// want.
//
// The one wrinkle is a reveal "feature": it remembers the vertical slide you
// last viewed in each stack (a `data-previous-indexv` attribute) and, when you
// later arrive at that stack going *forward*, resumes there instead of at the
// top. So after skipping ahead into a later stack and then coming back, forward
// navigation quietly jumps partway down that stack rather than showing it from
// the first slide — the traversal order seems to change out from under you.
// (This is independent of which keys you press — arrows, hjkl, Space, PageDown
// all funnel through the same next()/navigateRight() path.)
//
// Backward navigation is already correct: reveal computes the previous stack's
// *last* slide explicitly for prev(), so it never consults this attribute.
//
// Fix: after every slide change, strip the remembered index off all stacks, so
// forward entry always lands on the first vertical slide. We deliberately leave
// any author-set `data-start-indexv` alone — that one is intentional.
(function () {
  function clearRemembered() {
    var stacks = document.querySelectorAll('.reveal section.stack[data-previous-indexv]');
    for (var i = 0; i < stacks.length; i++) stacks[i].removeAttribute('data-previous-indexv');
  }

  var attached = false;
  function attach() {
    if (attached || !window.Reveal || !Reveal.on) return false;
    attached = true;
    // slidechanged fires at the end of each slide(); reveal writes the departed
    // stack's data-previous-indexv during that same call, so clearing here wipes
    // it before the next navigation can read it.
    Reveal.on('slidechanged', clearRemembered);
    clearRemembered(); // also drop anything left by the initial/deep-linked state
    return true;
  }

  // Reveal may not be initialised yet when this after-body script runs; wait for it.
  if (!attach()) {
    var iv = setInterval(function () { if (attach()) clearInterval(iv); }, 50);
    setTimeout(function () { clearInterval(iv); }, 10000);
  }
})();
</script>
<script>
// Even gutters between overview previews.
//
// Reveal lays the overview grid on a pitch of `getComputedSlideSize() + 70`.
// That size is the inset content frame reveal runs in, and the 70 is a
// constant in slide units -- neither knows about the card a preview actually
// draws, which is the whole authored page and 16:9 where the frame is taller.
// A card sized to fill that pitch therefore leaves 4 slide units of gutter
// beside it and 150 below it: horizontally the previews touch, and the grid
// stops reading as separate slides.
//
// The pitch is ours to set, because the only zero-argument call to
// getComputedSlideSize() in reveal is the one overview makes when it activates
// -- layout and the print view both pass a viewport size -- so wrapping that
// one case changes the grid and nothing else. Both overview's layout() and its
// update() (which recentres the current card) read the numbers it derives
// there, so the selection stays centred with no second correction.
//
// The deck instance, not window.Reveal: the global is a facade of bound
// forwarders, and the overview controller calls the method on the instance it
// was handed. A plugin's init() is what hands it over.
(function () {
  // reveal's own overview spacing, subtracted back out of the pitch we want.
  var REVEAL_OVERVIEW_MARGIN = 70;

  function setPitch(deck) {
    var stage = document.querySelector('[data-deck-stage]');
    if (!stage || typeof deck.getComputedSlideSize !== 'function') return;
    var inner = deck.getComputedSlideSize;
    deck.getComputedSlideSize = function (width, height) {
      if (width !== undefined || height !== undefined) return inner.apply(this, arguments);
      var stageStyle = getComputedStyle(stage);
      var read = function (name) { return parseFloat(stageStyle.getPropertyValue(name)); };
      var cardWidth = read('--deck-overview-card-width');
      var cardHeight = read('--deck-overview-card-height');
      var gap = read('--deck-overview-card-gap');
      // No stylesheet, no opinion: leave reveal's own pitch alone.
      if (!cardWidth || !cardHeight || !gap) return inner.apply(this, arguments);
      return {
        width: cardWidth + gap - REVEAL_OVERVIEW_MARGIN,
        height: cardHeight + gap - REVEAL_OVERVIEW_MARGIN
      };
    };
  }

  function attach() {
    if (!window.Reveal || !Reveal.registerPlugin) return false;
    Reveal.registerPlugin({ id: 'slide-stage-overview-pitch', init: setPitch });
    return true;
  }

  if (!attach()) {
    var iv = setInterval(function () { if (attach()) clearInterval(iv); }, 50);
    setTimeout(function () { clearInterval(iv); }, 10000);
  }
})();
</script>
<script>
// Show every slide's preview in Overview mode.
//
// reveal lazy-loads slides: any slide beyond its "view distance" from the
// current one is unloaded (display:none) to save memory. In Overview that
// distance is hard-capped at 10 (it ignores the `view-distance` config), and
// for each *other* stack the vertical window is centred on that stack's
// remembered index — so slides at the bottom of a tall stack, or anything in a
// distant stack, show as blank cells until you navigate onto them, at which
// point they abruptly pop in. That makes Overview an unreliable map of the deck.
//
// Fix: while Overview is open, eagerly load every slide so the whole grid is
// populated. reveal has already positioned each cell — its overview layout()
// sets a transform on every section regardless of load state — so a freshly
// loaded slide drops straight into its correct spot. We re-run on slidechanged
// because moving around inside Overview calls slide(), which unloads far slides
// again. Outside Overview we do nothing, so normal lazy-loading is untouched.
//
// Not on a touch device. There the cost is the point: opening the overview in
// the middle of a 50-slide lecture deck killed the WebContent process on an
// iPad Pro every time it was tried, which ends a lecture rather than making a
// grid look patchy. With this pass off, reveal's own lazy loading brings up 26
// of those 50 and the overview survives being opened and closed all day.
//
// Drawing the ones it leaves out -- forced visible with only their headings,
// so none of the content is laid out -- was measured too, on the theory that
// an empty card is nearly free. It is not: that crashed on the first open,
// exactly as eager loading did, so the cost is in having the cells at all
// rather than in what is inside them. Reveal's view distance is wider than the
// grid shows in any case, so the cards this loses are off-screen ones.
(function () {
  function loadAll() {
    if (!window.Reveal || !Reveal.isOverview || !Reveal.isOverview()) return;
    // Every section in the deck, not Reveal.getSlides(): that list leaves out
    // slides marked data-visibility="uncounted" (Quarto's incremental repeats),
    // which would then stay display:none as holes in the middle of the grid.
    var slides = document.querySelectorAll('.reveal .slides section');
    slides.forEach(function (s) { Reveal.loadSlide(s); });
  }

  var attached = false;
  function attach() {
    if (attached || !window.Reveal || !Reveal.on) return false;
    attached = true;
    if (!matchMedia('(any-pointer: coarse)').matches) {
      Reveal.on('overviewshown', loadAll);
      Reveal.on('slidechanged', loadAll); // moving within Overview re-unloads far slides
    }
    return true;
  }

  if (!attach()) {
    var iv = setInterval(function () { if (attach()) clearInterval(iv); }, 50);
    setTimeout(function () { clearInterval(iv); }, 10000);
  }
})();
</script>
<script>
// Placeholders for the slides the touch overview does not load.
//
// The gate above leaves reveal's lazy loading alone on a touch device, which
// keeps the grid inside the memory the web process is allowed -- it was being
// killed at 5.4 GB -- but it also leaves a gap wherever a slide is unloaded.
//
// The obvious repair is to show the slide's own section with its contents
// hidden. That was measured on an iPad and it is not cheap: the section
// carries the whole authored subtree, and making it visible again drags all of
// it back into style and layout, which killed the process on the first open
// exactly as eager loading did. A placeholder that is its own small element
// and never touches the section survived the same test indefinitely.
//
// Position is copied from the section rather than recomputed: reveal lays out
// every cell in the grid whether or not it loaded the slide, so the transform
// is already sitting on the element, correct and free. The placeholder goes in
// the section's own parent to read it, because a slide inside a stack carries
// only its vertical offset -- the column is on the stack -- and one hung off
// `.slides` instead lands in the first column whatever stack it belongs to.
(function () {
  var GHOST = 'deck-overview-ghost';

  function cards() {
    var reveal = document.querySelector('.reveal');
    if (!reveal) return null;
    var style = getComputedStyle(reveal);
    var width = parseFloat(style.getPropertyValue('--deck-overview-card-width'));
    var height = parseFloat(style.getPropertyValue('--deck-overview-card-height'));
    return width && height ? { width: width, height: height } : null;
  }

  function title(section) {
    var heading = section.querySelector('h1, h2, h3');
    return heading ? (heading.textContent || '').replace(/\s+/g, ' ').trim() : '';
  }

  function clear() {
    [].forEach.call(document.querySelectorAll('.' + GHOST), function (ghost) { ghost.remove(); });
  }

  function draw() {
    clear();
    if (!Reveal.isOverview()) return;
    var slides = document.querySelector('.reveal .slides');
    var card = cards();
    if (!slides || !card) return;

    [].forEach.call(slides.querySelectorAll('section:not(.stack)'), function (section) {
      // reveal's own bookkeeping: unloading a slide is this and nothing else.
      if (section.style.display !== 'none') return;
      var ghost = document.createElement('button');
      ghost.type = 'button';
      ghost.className = GHOST;
      ghost.setAttribute('data-for', section.id || '');
      ghost.textContent = title(section);
      ghost.style.width = card.width + 'px';
      ghost.style.height = card.height + 'px';
      ghost.style.top = section.style.top || '0px';
      ghost.style.transform = section.style.transform || 'none';
      ghost.addEventListener('click', function () {
        var at = Reveal.getIndices(section);
        Reveal.slide(at.h, at.v || 0);   // a slide outside a stack has no v
      });
      section.parentElement.appendChild(ghost);
    });
  }

  function attach() {
    if (!window.Reveal || !Reveal.on) return false;
    if (!matchMedia('(any-pointer: coarse)').matches) return true;
    Reveal.on('overviewshown', draw);
    Reveal.on('overviewhidden', clear);
    // Moving inside the grid reloads one neighbourhood and unloads another.
    Reveal.on('slidechanged', draw);
    return true;
  }

  if (!attach()) {
    var iv = setInterval(function () { if (attach()) clearInterval(iv); }, 50);
    setTimeout(function () { clearInterval(iv); }, 10000);
  }
})();
</script>
<script>
// Arrow-key panning of the reveal.js zoom plugin.
//
// The zoom plugin (Alt/Option-click to magnify) is all-or-nothing: land on
// slightly the wrong spot and you have to zoom out and try again. This lets you
// nudge the magnified view with the arrow keys once zoomed in, so a near-miss
// is a quick correction instead of a retry. Hold Shift for larger steps.
//
// We deliberately do NOT add click-and-drag panning: dragging is how the
// annotation pen draws, so the two would fight. Arrow keys stay clear of it.
//
// Implementation: the plugin magnifies by setting a CSS transform of the form
//   translate(tx, ty) scale(s)
// on document.body (and toggles the `zoomed` class on <html>). We read that
// transform's *target* from the inline style — not getComputedStyle, which would
// return a mid-animation value while the transition is running — then shift the
// translation and write it back. Nudges use a snappier transition than zoom
// in/out so repeated presses feel responsive.
(function () {
  var DEFAULT_TRANSITION = 'transform 0.8s ease'; // matches the zoom plugin
  var NUDGE_TRANSITION = 'transform 0.12s ease';
  var STEP = 0.06;       // fraction of the viewport panned per key press
  var BIG_STEP = 0.18;   // ... while holding Shift

  function isZoomed() {
    return document.documentElement.classList.contains('zoomed');
  }

  // The modifier that triggers the zoom plugin (ctrl on Linux, otherwise alt),
  // honouring an explicit `zoomKey` config if one is set.
  function zoomModifierProp() {
    var key = /Linux/.test(window.navigator.platform) ? 'ctrl' : 'alt';
    if (window.Reveal && Reveal.getConfig && Reveal.getConfig().zoomKey) {
      key = Reveal.getConfig().zoomKey;
    }
    return key + 'Key';
  }

  function currentTransform() {
    // Prefer the inline style: it holds the final target the plugin set, even
    // while the transition is still animating towards it.
    var t = document.body.style.transform || getComputedStyle(document.body).transform;
    if (!t || t === 'none') return null;
    try { return new DOMMatrix(t); } catch (e) { return null; }
  }

  function nudge(dx, dy) {
    var m = currentTransform();
    if (!m) return;
    document.body.style.transition = NUDGE_TRANSITION;
    document.body.style.transform =
      'translate(' + (m.e + dx) + 'px, ' + (m.f + dy) + 'px) scale(' + m.a + ')';
  }

  // Capture phase on window so we intercept the arrows before reveal.js uses
  // them for slide navigation — but only while zoomed in.
  window.addEventListener('keydown', function (e) {
    if (!isZoomed()) return;            // un-zoomed: leave navigation untouched
    if (e.metaKey || e.ctrlKey || e.altKey) return;

    if (e.key === 'Escape') {
      // Let the plugin's own zoom-out animate at the normal speed rather than
      // the snappy nudge speed we may have just set.
      document.body.style.transition = DEFAULT_TRANSITION;
      return;
    }

    var step = e.shiftKey ? BIG_STEP : STEP;
    var dx = window.innerWidth * step;
    var dy = window.innerHeight * step;
    var handled = true;
    // Arrow = the direction the view pans towards (content slides the other way).
    switch (e.key) {
      case 'ArrowLeft':  nudge( dx,   0); break;
      case 'ArrowRight': nudge(-dx,   0); break;
      case 'ArrowUp':    nudge(  0,  dy); break;
      case 'ArrowDown':  nudge(  0, -dy); break;
      default: handled = false;
    }
    if (handled) {
      e.preventDefault();
      e.stopImmediatePropagation();
    }
  }, true);

  // An Alt/Option-click toggles zoom (in or out); make sure it animates at the
  // normal speed regardless of any nudge transition left behind.
  window.addEventListener('mousedown', function (e) {
    if (e[zoomModifierProp()]) {
      document.body.style.transition = DEFAULT_TRANSITION;
    }
  }, true);
})();
</script>
