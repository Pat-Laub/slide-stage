title: Slide stage
author: Patrick Laub
version: 0.1.0
quarto-required: ">=1.4.0"
contributes:
  formats:
    revealjs:
      # The authored page is 3744 x 2106 and one uniform transform shrinks it to
      # whatever viewport it lands on. Reveal itself runs embedded and unscaled
      # inside the inset content frame, which is why `width`/`height` here are
      # the frame rather than the page, and why min/max-scale pin Reveal's own
      # scaling off entirely.
      width: 3072
      height: 1845
      margin: 0
      min-scale: 1
      max-scale: 1
      embedded: true
      history: false
      navigation-mode: linear
      output-ext: "slides.html"
      search: false
      controls: true
      controls-tutorial: true
      transition: fade
      transition-speed: slow
      slide-number: c/t
      preview-links: false
      code-annotations: none
      theme:
        - serif
        - slide-stage.scss
      include-before-body:
        - deck-stage-open.html
      include-after-body:
        - reveal-fixes.html
        - deck-stage-close.html
